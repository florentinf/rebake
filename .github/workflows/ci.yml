# Build and test only. furka takes SSH over Tailscale alone, so deploys run from
# a machine on the tailnet: `npm run deploy`.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 10
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pandoc qpdf
      - run: npm run fixtures
        env:
          REBAKE_FIXTURES: ${{ runner.temp }}/fixtures
      - run: npm test
        env:
          REBAKE_FIXTURES: ${{ runner.temp }}/fixtures

  # Safari never runs on Linux, so WebKit's media tests run on the system it ships on.
  webkit-media:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: sysctl -n machdep.cpu.brand_string && sw_vers -productVersion
      - run: npx playwright install webkit
        timeout-minutes: 10
      - run: brew install ffmpeg pandoc qpdf
      - run: npm run fixtures
        env:
          REBAKE_FIXTURES: ${{ runner.temp }}/fixtures
      - run: npx playwright test --project=webkit tests/media.spec.ts tests/hdr.spec.ts tests/capability.spec.ts tests/batch.spec.ts tests/drawer.spec.ts
        env:
          REBAKE_FIXTURES: ${{ runner.temp }}/fixtures
